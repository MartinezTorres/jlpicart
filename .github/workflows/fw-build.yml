# fw-build.yml — JLPiCart firmware CI

name: Firmware build

on:
  push:
    branches: [ main ]
    paths: [ 'fw/**', 'tools/**', '.github/workflows/fw-build.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'fw/**', 'tools/**', '.github/workflows/fw-build.yml' ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # build — firmware + host tests (fast, runs on every trigger)
  # ---------------------------------------------------------------------------
  build:
    name: Build firmware and host tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Pico SDK + toolchain
        run: bash tools/fetch_pico_sdk.sh

      - name: Fetch SDCC (Z80 compiler)
        run: bash tools/fetch_sdcc.sh

      - name: Configure firmware
        run: |
          mkdir -p fw/build
          PICO_TOOLCHAIN_PATH="${GITHUB_WORKSPACE}/fw/.pico-sdk/toolchain/14_2_Rel1/bin" \
            cmake -S fw -B fw/build -DCMAKE_BUILD_TYPE=Release

      - name: Build firmware
        run: make -j$(nproc) -C fw/build

      - name: Verify no old_src references
        run: |
          COUNT=$(grep -c "old_src" fw/build/compile_commands.json || true)
          if [ "$COUNT" -ne 0 ]; then
            echo "ERROR: old_src found in compile_commands.json"
            exit 1
          fi
          echo "OK: no old_src references"

      - name: Build host tests
        run: |
          mkdir -p fw/tests/build
          cmake -S fw/tests -B fw/tests/build
          make -j$(nproc) -C fw/tests/build

      - name: Run host tests
        run: ctest --test-dir fw/tests/build --output-on-failure

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            fw/build/jlpicart.elf
            fw/build/jlpicart.uf2

  # ---------------------------------------------------------------------------
  # openmsx — build the MSX emulator (slow, separate job)
  # Not needed until Stage 5 (menu stub ROM testing).
  # ---------------------------------------------------------------------------
  openmsx:
    name: Build openMSX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (openMSX submodule only)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout openMSX submodule
        run: git submodule update --init third_party/openMSX

      - name: Install openMSX build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            tcl-dev libpng-dev libogg-dev libvorbis-dev \
            libtheora-dev zlib1g-dev

      - name: Build openMSX
        run: bash tools/build_openmsx.sh

      - name: Verify openMSX binary
        run: tools/openmsx/bin/openmsx --version

      - name: Upload openMSX artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmsx
          # Upload the full install tree (bin/ + share/) so the test job can
          # use it without needing to re-check out the openMSX submodule.
          path: tools/openmsx/

  # ---------------------------------------------------------------------------
  # openmsx-tests — run TCL integration tests under the pinned openMSX build
  # Depends on: build (for the menupage stub ROM) + openmsx (for the emulator)
  # ---------------------------------------------------------------------------
  openmsx-tests:
    name: openMSX integration tests
    runs-on: ubuntu-latest
    needs: [ build, openmsx ]

    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download openMSX artifact
        uses: actions/download-artifact@v4
        with:
          name: openmsx
          path: tools/openmsx

      - name: Restore openMSX binary permissions
        run: chmod +x tools/openmsx/bin/openmsx

      - name: Install C-BIOS and runtime libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cbios \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0 \
            tcl libogg0 libvorbis0a libtheora0
          # Copy C-BIOS ROMs into the openMSX share systemroms directory so
          # openMSX finds them via OPENMSX_SYSTEM_DATA.
          mkdir -p tools/openmsx/share/systemroms
          cp /usr/share/cbios/*.rom tools/openmsx/share/systemroms/

      - name: Fetch SDCC (Z80 compiler)
        run: bash tools/fetch_sdcc.sh

      - name: Build menupage.rom
        run: |
          PATH="${GITHUB_WORKSPACE}/tools/sdcc/bin:$PATH" \
            make -C fw/src/msx/menu/stub menupage.rom

      - name: Verify openMSX binary
        run: OPENMSX_SYSTEM_DATA=tools/openmsx/share tools/openmsx/bin/openmsx --version

      - name: Run test_menu_stub_basic
        run: |
          OPENMSX_BIN="${GITHUB_WORKSPACE}/tools/openmsx/bin/openmsx" \
          OPENMSX_SYSTEM_DATA="${GITHUB_WORKSPACE}/tools/openmsx/share" \
            bash fw/tests/openMSX/run_test.sh fw/tests/openMSX/test_menu_stub_basic.tcl

      - name: Run test_menu_bus
        run: |
          OPENMSX_BIN="${GITHUB_WORKSPACE}/tools/openmsx/bin/openmsx" \
          OPENMSX_SYSTEM_DATA="${GITHUB_WORKSPACE}/tools/openmsx/share" \
          TEST_MACHINE=msx1_jlpicart_bus \
            bash fw/tests/openMSX/run_test.sh fw/tests/openMSX/test_menu_bus.tcl
